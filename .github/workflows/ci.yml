name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the training workstation runs on; tests/test_phase0_gate.py
        # pins the same floor so a lint autofix cannot quietly raise it.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cpu.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Test suite
        run: python -m pytest -q

      - name: Likelihood-ratio acceptance self-test
        # The three assertions that must hold before any model exists:
        # clear manipulation, unstable abstains, out-of-domain abstains.
        run: python -m tools.selftest_lr

  determinism:
    name: replay determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cpu.txt
      - name: Canonicalisation and hashing must be stable across processes
        # PYTHONHASHSEED is deliberately left random: canon.stable_seed digests its
        # inputs precisely so that a salted built-in hash() can never reach a seed.
        run: |
          python -m pytest tests/test_canon.py -q
          A=$(python -c "from peri.core.canon import hash_obj; print(hash_obj({'b':1.0,'a':[2.0,3.0]}))")
          B=$(python -c "from peri.core.canon import hash_obj; print(hash_obj({'a':[2.0,3.0],'b':1.0}))")
          echo "run A: $A"
          echo "run B: $B"
          test "$A" = "$B" || { echo "findings hash is not stable across processes"; exit 1; }
